name: ActBlue Daily Sync

on:
  schedule:
    # Runs every day at 6:00 AM UTC (adjust to your timezone)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days back to fetch (default: 1)"
        required: false
        default: "1"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ActBlue sync
        env:
          ACTBLUE_CLIENT_UUID: ${{ secrets.ACTBLUE_CLIENT_UUID }}
          ACTBLUE_CLIENT_SECRET: ${{ secrets.ACTBLUE_CLIENT_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
        run: python actblue_sync.py
